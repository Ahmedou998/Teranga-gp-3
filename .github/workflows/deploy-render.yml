name: Deploy to Render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Add the Render deploy hook as the RENDER_DEPLOY_HOOK repository secret."
            exit 1
          fi

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 30 --request POST "$RENDER_DEPLOY_HOOK")" || {
              echo "::error::Could not reach the Render deploy hook."
              exit 1
            }

          case "$status" in
            2??) echo "Render accepted the deployment request." ;;
            *) echo "::error::Render rejected the deployment request (HTTP $status)."; exit 1 ;;
          esac
