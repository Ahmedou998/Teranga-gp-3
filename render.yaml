databases:
  - name: teranga-gp-db
    databaseName: teranga_gp
    user: teranga_gp
    plan: free
    region: frankfurt

services:
  - type: web
    name: teranga-gp
    runtime: node
    plan: free
    region: frankfurt
    autoDeploy: true
    buildCommand: npm ci --include=dev --legacy-peer-deps && npm run build
    startCommand: npm run db:deploy && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://teranga-gp.onrender.com
      - key: BETTER_AUTH_URL
        value: https://teranga-gp.onrender.com
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: teranga-gp-db
          property: connectionString
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AI_ASSISTANT_ENABLED
        value: "false"
