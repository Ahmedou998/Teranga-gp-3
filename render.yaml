databases:
  - name: teranga-gp-db
    databaseName: teranga_gp
    user: teranga_gp
    plan: basic-256mb
    region: frankfurt

services:
  - type: web
    name: teranga-gp
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: teranga-gp-db
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        sync: false
