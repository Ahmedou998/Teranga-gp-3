databases:
  - name: teranga-gp-db
    databaseName: teranga_gp
    user: teranga_gp
    plan: basic-256mb
    region: frankfurt

services:
  - type: web
    name: teranga-gp
    runtime: node
    plan: starter
    region: frankfurt
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run db:deploy && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: teranga-gp-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AI_ASSISTANT_ENABLED
        value: "false"
